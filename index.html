<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Occasion — Music for the Moment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0e0d;
      --bg2: #161412;
      --bg3: #1e1b18;
      --border: rgba(255,255,255,0.07);
      --text: #e8e0d4;
      --muted: #7a7068;
      --accent: #c8975a;
      --accent-glow: rgba(200,151,90,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      padding: 3.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(ellipse, rgba(200,151,90,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .site-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .tagline {
      margin-top: 1rem;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── CATEGORIES NAV ── */
    .categories {
      padding: 3rem 2rem 0;
      max-width: 1200px;
      margin: 0 auto;
    }

    .categories-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }

    .cat-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.1rem 1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .cat-btn:hover {
      border-color: rgba(200,151,90,0.3);
      background: var(--bg3);
    }

    .cat-btn.active {
      border-color: var(--accent);
      background: var(--bg3);
    }

    .cat-btn.active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-glow);
      pointer-events: none;
    }

    .cat-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .cat-name {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.3;
    }

    .cat-sub {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ── ALBUMS SECTION ── */
    .albums-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.1;
    }

    .section-title small {
      display: block;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .section-mood {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 280px;
      text-align: right;
      line-height: 1.5;
    }

    /* ── ALBUM GRID ── */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .album-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: default;
      display: flex;
      flex-direction: column;
    }

    .album-card:hover {
      border-color: rgba(200,151,90,0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
    }

    .cover-art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cover-art .vinyl {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        #1a1a1a 0deg, #2a2a2a 10deg, #1a1a1a 20deg, #2a2a2a 30deg,
        #1a1a1a 40deg, #2a2a2a 50deg, #1a1a1a 60deg, #2a2a2a 70deg,
        #1a1a1a 80deg, #2a2a2a 90deg, #1a1a1a 100deg, #2a2a2a 110deg,
        #1a1a1a 120deg, #2a2a2a 130deg, #1a1a1a 140deg, #2a2a2a 150deg,
        #1a1a1a 160deg, #2a2a2a 170deg, #1a1a1a 180deg, #2a2a2a 190deg,
        #1a1a1a 200deg, #2a2a2a 210deg, #1a1a1a 220deg, #2a2a2a 230deg,
        #1a1a1a 240deg, #2a2a2a 250deg, #1a1a1a 260deg, #2a2a2a 270deg,
        #1a1a1a 280deg, #2a2a2a 290deg, #1a1a1a 300deg, #2a2a2a 310deg,
        #1a1a1a 320deg, #2a2a2a 330deg, #1a1a1a 340deg, #2a2a2a 350deg,
        #1a1a1a 360deg
      );
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      transition: transform 8s linear;
    }

    .album-card:hover .vinyl {
      transform: translate(-50%, -50%) rotate(180deg);
    }

    .cover-art .vinyl-label {
      width: 28%;
      height: 28%;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .album-info {
      padding: 1.2rem 1.4rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .album-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .album-year {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: rgba(200,151,90,0.12);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
    }

    .album-genre {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .album-title {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 0.25rem;
    }

    .album-artist {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .album-desc {
      font-size: 0.83rem;
      color: rgba(232,224,212,0.65);
      line-height: 1.65;
      flex: 1;
    }

    .album-footer {
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .album-source {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .album-source span {
      color: var(--accent);
      font-weight: 600;
    }

    .listen-links {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .listen-btn {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.6rem;
      border-radius: 3px;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .listen-btn.spotify {
      background: rgba(30,215,96,0.1);
      color: #1ed760;
      border-color: rgba(30,215,96,0.2);
    }

    .listen-btn.spotify:hover {
      background: rgba(30,215,96,0.18);
      border-color: rgba(30,215,96,0.4);
    }

    .listen-btn.youtube {
      background: rgba(255,0,0,0.08);
      color: #ff4444;
      border-color: rgba(255,68,68,0.2);
    }

    .listen-btn.youtube:hover {
      background: rgba(255,68,68,0.15);
      border-color: rgba(255,68,68,0.4);
    }

    .listen-btn svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }

    /* ── TRANSITIONS ── */
    .albums-section { animation: fadeUp 0.4s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer span { color: var(--accent); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .section-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .section-mood { text-align: left; max-width: 100%; }
      .cat-grid { grid-template-columns: repeat(2, 1fr); }
      .album-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function spotifyUrl(artist, title) {
      const q = encodeURIComponent(`${artist} ${title}`);
      return `https://open.spotify.com/search/${q}`;
    }

    function youtubeUrl(artist, title) {
      const q = encodeURIComponent(`${artist} ${title} full album`);
      return `https://www.youtube.com/results?search_query=${q}`;
    }

    let active = 'dinner';

    function renderCategories() {
      const grid = document.getElementById('catGrid');
      grid.innerHTML = data.categories.map(c => `
        <button class="cat-btn ${c.id === active ? 'active' : ''}" data-id="${c.id}">
          <span class="cat-icon">${c.icon}</span>
          <span class="cat-name">${c.name.replace('\n', '<br>')}</span>
          <span class="cat-sub">${c.sub}</span>
        </button>
      `).join('');
      grid.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          active = btn.dataset.id;
          renderCategories();
          renderAlbums();
        });
      });
    }

    function renderAlbums() {
      const cat = data.categories.find(c => c.id === active);
      const section = document.getElementById('albumsSection');
      section.style.animation = 'none';
      section.offsetHeight;
      section.style.animation = '';

      section.innerHTML = `
        <div class="section-header">
          <div class="section-title">
            <small>${cat.icon} ${cat.sub}</small>
            ${cat.name.replace('\n', ' ')}
          </div>
          <p class="section-mood">${cat.mood}</p>
        </div>
        <div class="album-grid">
          ${cat.albums.map(a => `
            <article class="album-card">
              <div class="album-cover">
                <div class="cover-art" style="background: linear-gradient(135deg, ${a.hue1} 0%, ${a.hue2} 100%);">
                  <div class="vinyl">
                    <div class="vinyl-label" style="background: ${a.label}; box-shadow: 0 0 20px ${a.label}40;"></div>
                  </div>
                </div>
              </div>
              <div class="album-info">
                <div class="album-meta">
                  <span class="album-year">${a.year}</span>
                  <span class="album-genre">${a.genre}</span>
                </div>
                <h2 class="album-title">${a.title}</h2>
                <p class="album-artist">${a.artist}</p>
                <p class="album-desc">${a.desc}</p>
                <div class="album-footer">
                  <p class="album-source">Via <span>${a.source}</span></p>
                  <div class="listen-links">
                    <a class="listen-btn spotify" href="${spotifyUrl(a.artist, a.title)}" target="_blank" rel="noopener">
